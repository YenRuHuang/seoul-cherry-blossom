<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首爾賞櫻地圖 2026 — Seoul Cherry Blossom Map</title>
  <meta name="description" content="2026 首爾櫻花景點互動地圖，75+ 個春花路線，繁體中文介面，專為台灣旅客設計">
  <meta property="og:title" content="首爾賞櫻地圖 2026 — 台灣人專用繁中版">
  <meta property="og:description" content="75+ 個首爾春花景點＋地鐵站資訊＋Google/Naver 導航，收藏景點一鍵出發！">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cherry.mursfoto.com">
  <meta property="og:image" content="https://cherry.mursfoto.com/og-image.png">
  <meta name="theme-color" content="#1a1a1a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <p class="header-eyebrow">Seoul Spring 2026</p>
        <h1>首爾賞櫻地圖</h1>
        <p class="subtitle">75+ 春花景點 · 地鐵導航 · 繁體中文</p>
      </div>
      <div class="share-btns">
        <button class="share-btn" id="shareLine">LINE</button>
        <button class="share-btn" id="shareCopy">複製連結</button>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="region-bar" id="regionBar">
      <button class="region-btn active" data-region="seoul">首爾</button>
      <button class="region-btn" data-region="jeju">濟州島</button>
      <button class="region-btn" data-region="busan">釜山</button>
    </div>
    <div class="search-wrap">
      <input type="text" class="search-input" id="searchInput" placeholder="搜尋景點、地鐵站、花種...">
    </div>
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn fave-filter" data-filter="fave">收藏 <span class="count" id="faveCount">0</span></button>
      <button class="filter-btn" data-filter="cherry">櫻花</button>
      <button class="filter-btn" data-filter="forsythia">迎春花</button>
      <button class="filter-btn" data-filter="azalea">杜鵑花</button>
      <button class="filter-btn" data-filter="tulip">鬱金香</button>
      <button class="filter-btn" data-filter="rapeseed">油菜花</button>
      <button class="filter-btn" data-filter="hydrangea">繡球花</button>
      <button class="filter-btn" data-filter="camellia">山茶花</button>
      <button class="filter-btn" data-filter="buckwheat">蕎麥花</button>
      <button class="filter-btn" data-filter="silvergrass">芒草</button>
      <button class="filter-btn" data-filter="plum">梅花</button>
      <button class="filter-btn" data-filter="other">其他</button>
    </div>
    <div class="month-bar" id="monthBar">
      <button class="month-btn active" data-month="0">全年</button>
      <button class="month-btn" data-month="1">1月</button>
      <button class="month-btn" data-month="2">2月</button>
      <button class="month-btn" data-month="3">3月</button>
      <button class="month-btn" data-month="4">4月</button>
      <button class="month-btn" data-month="5">5月</button>
      <button class="month-btn" data-month="6">6月</button>
      <button class="month-btn" data-month="7">7月</button>
      <button class="month-btn" data-month="8">8月</button>
      <button class="month-btn" data-month="9">9月</button>
      <button class="month-btn" data-month="10">10月</button>
      <button class="month-btn" data-month="11">11月</button>
      <button class="month-btn" data-month="12">12月</button>
      <span class="month-hint">預估花期，實際依天氣而定</span>
    </div>
  </div>

  <div id="map"></div>

  <div class="stats-bar">
    <span><span class="result-count" id="resultCount">0</span> 個景點</span>
    <span>地圖左側 📍 可定位</span>
  </div>

  <div id="spotList" class="spot-list"></div>

  <div class="bloom-tip">
    <div class="bloom-tip-inner">
      <div class="bloom-tip-text">
        <strong>即時花況</strong>
        <span>打開 Kakao Map app，搜尋欄下方點「Cherry Blossom」按鈕，各景點會顯示預計花期。</span>
      </div>
      <div class="bloom-tip-links">
        <a class="bloom-tip-dl" href="https://apps.apple.com/app/id304608425" target="_blank" rel="noopener">iOS</a>
        <a class="bloom-tip-dl" href="https://play.google.com/store/apps/details?id=net.daum.android.map" target="_blank" rel="noopener">Android</a>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-links">
        <a href="https://www.seoul.go.kr/storyw/springflowerway/list.do" target="_blank" rel="noopener">首爾市官方春花路</a>
        <span class="footer-dot"></span>
        <a href="https://www.kakaocorp.com/page/detail/11969" target="_blank" rel="noopener">Kakao Map 花況</a>
      </div>
      <p>花期僅供參考，實際依天氣而定</p>
      <p class="footer-credit"><a href="https://mursfoto.com" target="_blank" rel="noopener">mursfoto.com</a></p>
    </div>
  </footer>

  <button class="scroll-top" id="scrollTop" aria-label="回到頂部">&uarr;</button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="utils.js?v=1"></script>
  <script src="data.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
